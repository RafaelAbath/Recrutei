server {
    listen 80;
    server_name localhost;

    # --- Arquivos públicos (Laravel) ---
    root /var/www/html/public;
    index index.php index.html;

    # ---------------------------------------------------
    # Rotas Laravel (cai tudo aqui quando não for arquivo)
    # ---------------------------------------------------
    location / {
        # O $is_args$args evita “?query” duplicado
        try_files $uri $uri/ /index.php$is_args$args;
    }

    # ------------------------------
    # PHP – redireciona para o FPM
    # ------------------------------
    location ~ \.php$ {
        include fastcgi_params;      # ou fastcgi.conf no Alpine
        fastcgi_pass   app:9000;     # nome do serviço + porta
        fastcgi_index  index.php;

        # Resolve link-simbolic e garante path correto
        fastcgi_param SCRIPT_FILENAME  $realpath_root$fastcgi_script_name;

        # Opcional, mas costuma evitar erros de PATH_INFO
        fastcgi_param PATH_INFO        $fastcgi_path_info;
    }

    # ------------------
    # Arquivos “secretos”
    # ------------------
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # -------------
    # Qualquer extra
    # -------------
    # client_max_body_size  20m;        # uploads grandes
    # add_header X-Frame-Options SAMEORIGIN;
    # add_header X-Content-Type-Options nosniff;
}
