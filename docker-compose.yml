services:
  # PHP-FPM + Composer
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: locadora_app:latest
    container_name: locadora_app
    working_dir: /var/www/html
    user: "${UID:-1000}:${GID:-1000}"
    restart: unless-stopped
    volumes:
      - ./src:/var/www/html
    environment:
      HOME: /var/www/html
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: locadora
      DB_USERNAME: locadora
      DB_PASSWORD: locadora
      QUEUE_CONNECTION: redis
      REDIS_HOST: redis
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      elasticsearch:
        condition: service_healthy

  # Nginx → PHP-FPM
  web:
    image: nginx:stable-alpine
    container_name: locadora_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./src:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  mysql:
    image: mysql:8.1
    container_name: locadora_mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: locadora
      MYSQL_USER: locadora
      MYSQL_PASSWORD: locadora
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-plocadora"]
      interval: 10s
      retries: 5

  redis:
    image: redis:7
    container_name: locadora_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 3

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: locadora_es
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms1g -Xmx1g"
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      retries: 3

  # Worker de filas
  worker:
    image: locadora_app:latest
    container_name: locadora_worker
    working_dir: /var/www/html
    user: "${UID:-1000}:${GID:-1000}"
    command: php artisan queue:work --tries=3 --timeout=90
    restart: unless-stopped
    volumes:
      - ./src:/var/www/html
    environment:
      HOME: /var/www/html
      QUEUE_CONNECTION: redis
      REDIS_HOST: redis
    depends_on:
      - redis

  # Serviço Python de Relatórios (FastAPI)
  report:
    build:
      context: ./python-report
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    container_name: locadora_report
    env_file:
      - ./python-report/.env
    depends_on:
      - mysql
    networks:
      - default

volumes:
  dbdata: